dataset_metadata:
  # Populated at Stage 2 — Dataset Identification and Feasibility Gate (2026-10-28)

  - id: DATASET-001
    name: "RxSafeBench"
    description: "2,443 simulated clinical medication consultation scenarios with safety labels"
    source: "Zhao et al. 2025, IEEE BIBM 2025"
    github: "https://github.com/CAS-SIAT-XinHai/RxSafeBench"
    license: "CC0-1.0 (public domain)"
    size: "2,443 scenarios"
    language: "English only"
    safety_labels: "RxRisk DB (6,725 contraindications; 28,781 drug interactions)"
    doi: "10.48550/arxiv.2511.04328"
    role: "English base dataset for code-switching augmentation"
    verify_status: "[VERIFY] — confirm license and scenario count from GitHub data/ directory"
    note: "RxRisk DB full dataset (14,906 indication-drug pairs) NOT publicly released"

  - id: DATASET-002
    name: "SwitchLingua"
    description: "Large-scale multilingual code-switching dataset + generation framework"
    source: "NeurIPS 2025 Datasets & Benchmarks (accepted Sept 2025)"
    arxiv: "2506.00087"
    github: "https://github.com/Shelton1013/SwitchLingua"
    huggingface: "Shelton1013/SwitchLingua_text"
    license: "MIT"
    language_pairs: "EN-ES confirmed; AR-EN confirmed; multiple others"
    topics_covered: "business, entertainment, general, health, nation, science, sports, technology, world"
    cs_types: "intrasentential, intersentential, extra-sentential/tag switching"
    cs_ratios: "30%, 50%, 70% embedded language proportion"
    role: "Code-switching generation framework for ES-EN and AR-EN medication query variants"
    verify_status: "[VERIFY] — confirm health topic examples include medication content; confirm AR-EN includes MSA"
    note: "Generation scripts are the primary asset; content covers health but NOT medication safety specifically"

  - id: DATASET-003
    name: "CURE-Med / CUREMED-BENCH"
    description: "13-language multilingual medical reasoning benchmark; focuses on reasoning correctness, NOT safety"
    source: "Onyame et al. 2026, ACL 2026 main conference (oral)"
    arxiv: "2601.13262"
    github: "https://cure-med.github.io/"
    license: "CC-BY-4.0"
    size: "13 languages including Amharic, Yoruba, Swahili"
    language: "Multilingual (13 languages)"
    focus: "Medical reasoning accuracy + language consistency; NOT medication safety"
    role: "Concurrent work — related work section; differentiator confirmed"
    verify_status: "[VERIFY] — confirm dataset does NOT include ES-EN or AR-EN code-switched safety scenarios"
    note: "CONCURRENT. Key differentiator: CURE-Med tests reasoning; our benchmark tests safety degradation. Orthogonal."

  # Planned synthetic datasets (to be constructed in Stage 6)
