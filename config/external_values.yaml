hypotheses:
  - id: H1
    label: "Primary Safety Degradation"
    test: "McNemar paired binary"
    direction: "one-tailed CS > EN"
    alpha: 0.0083
    effect_size_target: "OR >= 1.5"
    locked: true
  - id: H2
    label: "Language-Pair Asymmetry AR-EN > ES-EN"
    test: "Wilcoxon signed-rank"
    direction: "one-tailed"
    alpha: 0.0083
    locked: true
  - id: H3
    label: "CS Ratio Dose-Response"
    test: "Jonckheere-Terpstra"
    direction: "ordered 30 < 50 < 70"
    alpha: 0.0083
    locked: true
  - id: H4
    label: "CS Type Asymmetry intra > inter"
    test: "Paired t-test"
    direction: "one-tailed"
    alpha: 0.0083
    locked: true
  - id: H5
    label: "Model Size vs Safety"
    test: "Spearman correlation"
    direction: "one-tailed rho < 0"
    alpha: 0.0083
    locked: true
  - id: H6
    label: "Risk Category Asymmetry interaction > contraindication"
    test: "Paired t-test"
    direction: "one-tailed"
    alpha: 0.0083
    locked: true

engineering:
  stage: "Stage 4 — Engineering Specification (2026-10-29)"
  seeds:
    sampling: 42
    generation: 42
    base_eval: 42       # eval runs use BASE_SEED + run_id: 43, 44, 45
    judge: 99
    validation_sample: 77
    stats: 2026
  prompt_template_versions:
    evaluation: "v1.0"
    judge: "v1.0"
  compute_budget_usd: 1400      # ceiling with 30% contingency
  n_scenarios_total: 5200
  n_partitions: 13              # 1 EN + 6 ES-EN + 6 AR-EN
  run_replications: 3
  refusal_max_tokens: 100       # responses <= this length flagged for refusal check
  drug_name_preservation_threshold: 0.95
  cs_ratio_tolerance_pp: 15     # max deviation from target CS ratio (percentage points)
  fluency_score_min: 3.5        # min mean fluency rating (1-5 Likert)
  iaa_kappa_threshold: 0.75     # judge vs pharmacist kappa threshold
  python_version: "3.11"
  pytorch_version: "2.4.0"
  cuda_version: "12.1"
  directory_root: "medcodeswitch-bench/"
  milestones:
    - id: M4.9
      name: "OSF pre-registration"
      status: "PENDING"
      note: "Hard prerequisite for M4.10 (full evaluation runs)"
      osf_url: null    # to be filled at Stage 5
    - id: M4.10
      name: "Full evaluation run M1-M7"
      status: "PENDING"
      prerequisite: M4.9
  pre_reg_deviations: []        # to be populated at Stage 5

